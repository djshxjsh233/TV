name: Build APK

on:
  push:
    branches: [fongmi, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Python 3.10 (for chaquo)
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=../keystore/release.jks" >> local.properties
          echo "keyAlias=fongmi" >> local.properties
          echo "storePassword=fongmi2026" >> local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK (mobile arm64)
        run: ./gradlew assembleMobileArm64_v8aRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: fongmi-mobile-arm64
          path: |
            app/build/outputs/apk/mobileArm64_v8a/release/*.apk
            app/build/outputs/apk/*/release/*.apk
